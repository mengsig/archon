[pipeline]
name = "test-coverage"
description = "Raise test coverage of existing code: analyze risk gaps, write tests, verify stability and mutation sensitivity, then ship; use bugfix to fix a known bug"
version = 1
workspace = "worktree"
requires_repo = true

# Archon ships the commits this stage records; no agent does.
[pipeline.ship]
stage = "write"

[nudges]
tier = "balanced"
notes = "For raising test coverage of existing code. Bugs found become follow-ups; use bugfix to fix one."

[[stage]]
id = "analyze"
kind = "work"
prompt = "analyze.md"
timeout_minutes = 90
nudge = "A capable model at medium effort to inspect coverage and rank behavioural risks."

[[stage]]
id = "write"
kind = "work"
prompt = "write.md"
timeout_minutes = 120
nudge = "A strong coding model at high effort for focused, deterministic tests."

[[stage]]
id = "verify"
kind = "test"
prompt = "verify.md"
gate = "all_pass"
timeout_minutes = 90
nudge = "A capable model at high effort to repeat tests and challenge each meaningful assertion with mutations."
on_fail = { goto = "write", max_loops = 2 }
