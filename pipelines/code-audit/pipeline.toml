[pipeline]
name = "code-audit"
description = "Audit a module or repository through three code-reading lenses and produce an HTML report; use ask for a single question"
version = 1
workspace = "worktree"
requires_repo = true

[nudges]
tier = "strongest"
independent_reviewers = true
notes = "Read-and-report only; findings become follow-up items. Pick this for a security, reliability or maintainability audit. Use ask for a single question, or agent-testing to exercise the running product."

[[stage]]
id = "scope"
kind = "work"
prompt = "scope.md"
timeout_minutes = 45

[[stage]]
id = "audit"
kind = "report"
prompt = "audit.md"
fan_out = 3
timeout_minutes = 120
effort = "high"
nudge = "Strongest tier, high effort. Independent auditors on distinct models or vendors where the allowlist permits, each with its own lens."

[[stage]]
id = "report"
kind = "report"
prompt = "report.md"
timeout_minutes = 45
