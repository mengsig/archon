[workspace]
resolver = "3"
members = ["crates/*", "bench"]

[workspace.package]
version = "1.4.9"
edition = "2024"
license = "MIT"
repository = "https://github.com/mengsig/archon"
rust-version = "1.98"
# Archon ships as release binaries, not through crates.io.
publish = false

[workspace.dependencies]
archon-core = { path = "crates/archon-core" }
archon-aether = { path = "crates/archon-aether" }
archon-client = { path = "crates/archon-client" }
archon-queue = { path = "crates/archon-queue" }
archon-pipeline = { path = "crates/archon-pipeline" }
archon-mcp = { path = "crates/archon-mcp" }
archon-lavish = { path = "crates/archon-lavish" }
archon-daemon = { path = "crates/archon-daemon" }
archon-remote = { path = "crates/archon-remote" }

anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc", "std", "sink"] }
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
qrcode = { version = "0.14.1", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", default-features = false, features = ["fs", "process", "std"] }
rustyline = { version = "19.0.0", default-features = false, features = ["custom-bindings", "with-file-history"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
terminal_size = "0.4.4"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
toml = "1.1.5"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = { version = "3.0.0", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = 1
