[pipeline]
name = "adaptive"
description = "One lead sizes, builds, integrates and reviews the change before shipping"
version = 1
workspace = "worktree"
requires_repo = true

# The lead's own reviewer is this pipeline's review: no later stage gates it.
[pipeline.review]
level = "standard"
stage = "build"

[nudges]
tier = "balanced"
independent_reviewers = true
notes = "For a repository change where one lead that keeps its context through fixes, or integrates parts that split, saves restarts. A small low-risk change belongs in quick-pr, and unrelated changes are never bundled to fit here."

[[stage]]
id = "build"
kind = "work"
prompt = "build.md"
allow_delegation = true
timeout_minutes = 180
nudge = "A strong coding model at high effort; medium for a bounded change in familiar code. x_high or max only for a reasoning problem you can name that inspecting the code left unresolved: that the operator prefers strong models is not one. The lead chooses its workers and its reviewer, and their models and efforts, at runtime within model policy."

[[stage]]
id = "ship"
kind = "ship"
prompt = "ship.md"
timeout_minutes = 90
nudge = "A fast model at low effort is enough for both ship modes."
