[pipeline]
name = "refactor"
description = "Characterize, refactor structure without changing behaviour, verify, review, then ship; use direct for behaviour changes"
version = 1
workspace = "worktree"
requires_repo = true

# Archon ships the commits this stage records; no agent does.
[pipeline.ship]
stage = "refactor"

[nudges]
tier = "balanced"
independent_reviewers = true
notes = "Structure-only change (rename, extract, split module, replace pattern), with behaviour-preservation checks. Not for changes that also alter behaviour: use direct."

[[stage]]
id = "baseline"
kind = "work"
prompt = "baseline.md"
timeout_minutes = 120
effort = "high"
nudge = "A strong coding model at high effort; characterize current behaviour before changing structure."

[[stage]]
id = "refactor"
kind = "work"
prompt = "refactor.md"
timeout_minutes = 120
effort = "high"
nudge = "A strong coding model at high effort; keep changes small and behaviour intact."

[[stage]]
id = "verify"
kind = "test"
prompt = "verify.md"
gate = "all_pass"
timeout_minutes = 90
effort = "high"
nudge = "A capable model at high effort; independently check behaviour and public-surface preservation."
on_fail = { goto = "refactor", max_loops = 3 }

[[stage]]
id = "review"
kind = "review"
prompt = "review.md"
gate = "all_pass"
timeout_minutes = 60
nudge = "Prefer a strong reviewer independent of the refactorer when the allowlist permits."
on_fail = { goto = "refactor", max_loops = 2 }
