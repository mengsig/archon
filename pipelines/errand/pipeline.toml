[pipeline]
name = "errand"
description = "Do a small job that changes no repository, answered in text or as a Lavish page; use ask for repository questions in text and a shipping pipeline for changes"
version = 1
workspace = "scratch"
requires_repo = false

[nudges]
tier = "balanced"
notes = "A small self-contained job: research, compare, summarize, check, draft or explain, answered in text or as an HTML page published in Lavish. No repository changes or outward side effects (pushes, PR or issue comments, merges, messages, purchases or paid API calls); those stay with the orchestrator. Use ask for a repository question answered in text, and direct or another shipping pipeline for any change."

[[stage]]
id = "errand"
kind = "report"
prompt = "errand.md"
timeout_minutes = 45
