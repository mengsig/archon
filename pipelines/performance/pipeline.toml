[pipeline]
name = "performance"
description = "Measure and optimize a specific slow path with a measurable goal, verify the gain, review, then ship; use direct for ordinary changes, not speculative micro-optimization"
version = 1
workspace = "worktree"
requires_repo = true

# Archon ships the commits this stage records; no agent does.
[pipeline.ship]
stage = "optimize"

[nudges]
tier = "strongest"
independent_reviewers = true
notes = "For a specific slow path with a measurable goal, not speculative micro-optimization. Prefer direct for ordinary features and fixes without a performance target."

[[stage]]
id = "measure"
kind = "work"
prompt = "measure.md"
timeout_minutes = 120
nudge = "Strongest tier, high effort; establish a reproducible baseline and profile the actual hotspot."

[[stage]]
id = "optimize"
kind = "work"
prompt = "optimize.md"
timeout_minutes = 180
nudge = "Strongest tier, high effort; preserve behavior while changing only the measured hotspot."

[[stage]]
id = "verify"
kind = "test"
prompt = "verify.md"
gate = "all_pass"
timeout_minutes = 120
nudge = "Strongest tier, high effort; independently reproduce the measurements and run the full test suite."
on_fail = { goto = "optimize", max_loops = 3 }

[[stage]]
id = "review"
kind = "review"
prompt = "review.md"
gate = "all_pass"
timeout_minutes = 90
nudge = "Strongest tier; prefer a reviewer independent of the optimizer when the allowlist permits."
on_fail = { goto = "optimize", max_loops = 2 }
