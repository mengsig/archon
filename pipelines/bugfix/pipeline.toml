[pipeline]
name = "bugfix"
description = "For a bug with a describable symptom: reproduce with a failing test, fix, independently review, then ship. Use quick-pr for trivial obvious one-liners and strict-pr-review for security or concurrency bugs."
version = 1
workspace = "worktree"
requires_repo = true

# Archon ships the commits this stage records; no agent does.
[pipeline.ship]
stage = "fix"

[nudges]
tier = "balanced"
independent_reviewers = true
notes = "Bug with a describable symptom. Use quick-pr for trivial obvious one-liners, strict-pr-review for security/concurrency bugs. A failing regression test is committed before the fix."

[[stage]]
id = "reproduce"
kind = "work"
prompt = "reproduce.md"
timeout_minutes = 60
nudge = "A careful model at medium effort; it establishes a failing regression test."

[[stage]]
id = "fix"
kind = "work"
prompt = "fix.md"
timeout_minutes = 120
nudge = "A strong coding model at high effort."

[[stage]]
id = "review"
kind = "review"
prompt = "review.md"
gate = "all_pass"
timeout_minutes = 60
nudge = "Prefer a reviewer model different from the fixer when the allowlist permits."
on_fail = { goto = "fix", max_loops = 2 }
