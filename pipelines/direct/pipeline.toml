[pipeline]
name = "direct"
description = "One agent makes, checks and commits a change one author can own; Archon ships it"
version = 1
workspace = "worktree"
requires_repo = true

# The item's review level decides how many reviewers the agent delegates to.
[pipeline.review]
level = "none"
stage = "implement"

# Archon ships the commits this stage records; no agent does.
[pipeline.ship]
stage = "implement"

[nudges]
tier = "fast"
notes = "The cheapest path to a shipped change: one agent, and no review unless the item's review level asks for one. For any change one author can make and check, whatever its size: a fix, docs, a feature in familiar code, a mechanical sweep. Raise the review level by risk; use adaptive when parts must be integrated."

[[stage]]
id = "implement"
kind = "work"
prompt = "implement.md"
timeout_minutes = 60
nudge = "A fast coding model at low effort for a contained change, medium for a larger one; the agent escalates a change that turns out risky."
