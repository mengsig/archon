[pipeline]
name = "quick-pr"
description = "Implement a small, well-understood change and ship it without a review stage"
version = 1
workspace = "worktree"
requires_repo = true

# Archon ships the commits this stage records; no agent does.
[pipeline.ship]
stage = "implement"

[nudges]
tier = "fast"
notes = "Fast and cheap: for small, low-risk changes (typos, docs, small fixes with an obvious test). No review stage, so step up the implement model if the change is less trivial than it looks, or use default-pr-review."

[[stage]]
id = "implement"
kind = "work"
prompt = "implement.md"
timeout_minutes = 90
nudge = "A fast, inexpensive coding model at medium effort; the stage refuses changes that turn out to be risky."
