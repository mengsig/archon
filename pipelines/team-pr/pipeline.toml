[pipeline]
name = "team-pr"
description = "Plan a split, build it as a backend and frontend team, test end to end, one review, then ship"
version = 1
workspace = "worktree"
requires_repo = true

# Archon ships the commits this stage records; no agent does.
[pipeline.ship]
stage = "review"

[nudges]
tier = "balanced"
independent_reviewers = true
notes = "For a change that spans cleanly separable parts, such as a backend and a frontend: the roles build in parallel on their own branches and are merged into one PR. Not for small or tightly coupled changes; use default-pr-review. To use other roles, override this pipeline in <repo>/.archon/pipelines/team-pr/."

[[stage]]
id = "plan"
kind = "work"
prompt = "plan.md"
timeout_minutes = 45
nudge = "A strong model at medium effort; it writes and commits a short plan, no code."

[[stage]]
id = "build"
kind = "team"
prompt = "build.md"
roles = ["backend", "frontend"]
timeout_minutes = 150
nudge = "A strong coding model at high effort for every role."

[[stage]]
id = "e2e"
kind = "test"
prompt = "e2e.md"
gate = "all_pass"
timeout_minutes = 90
nudge = "A capable model at high effort; it runs the product end to end."
on_fail = { goto = "build", max_loops = 2 }

[[stage]]
id = "review"
kind = "review"
prompt = "review.md"
gate = "all_pass"
timeout_minutes = 60
nudge = "Prefer a reviewer model different from the builders when the allowlist permits."
on_fail = { goto = "build", max_loops = 2 }
