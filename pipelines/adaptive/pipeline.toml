[pipeline]
name = "adaptive"
description = "One lead sizes, builds, integrates and reviews the change before shipping"
version = 1
workspace = "worktree"
requires_repo = true

# The lead's own reviewer is this pipeline's review: no later stage gates it.
[pipeline.review]
level = "standard"
stage = "build"

[nudges]
tier = "balanced"
independent_reviewers = true
notes = "For ordinary repository changes: keep one lead's context, split only useful work, and review the integrated result once at a depth matching risk."

[[stage]]
id = "build"
kind = "work"
prompt = "build.md"
allow_delegation = true
timeout_minutes = 180
nudge = "A strong coding model; choose effort for complexity. The lead chooses worker count and an independent reviewer at runtime within model policy."

[[stage]]
id = "ship"
kind = "ship"
prompt = "ship.md"
timeout_minutes = 90
nudge = "A fast model at low effort is enough for both ship modes."
