[pipeline]
name = "default-pr-review"
description = "Implement, one independent review with a bounded fix loop, then ship"
version = 1
workspace = "worktree"
requires_repo = true

# Archon ships the commits this stage records; no agent does.
[pipeline.ship]
stage = "implement"

[nudges]
tier = "balanced"
independent_reviewers = true
notes = "The default for ordinary features and fixes: one independent review with up to two fix loops."

[[stage]]
id = "implement"
kind = "work"
prompt = "implement.md"
timeout_minutes = 120
nudge = "A strong coding model at high effort."

[[stage]]
id = "review"
kind = "review"
prompt = "review.md"
gate = "all_pass"
timeout_minutes = 60
nudge = "Prefer a reviewer model different from the implementer when the allowlist permits."
on_fail = { goto = "implement", max_loops = 2 }
