[pipeline]
name = "direct"
description = "One agent makes, checks and commits a change one author can own; Archon ships it"
version = 1
workspace = "worktree"
requires_repo = true

# The item's review level decides how many reviewers the agent delegates to.
[pipeline.review]
level = "none"
stage = "implement"

# Archon ships the commits this stage records; no agent does.
[pipeline.ship]
stage = "implement"

[nudges]
tier = "balanced"
notes = "The cheapest path to a shipped change: one agent, and no review unless the item's review level asks for one. For any change one author can make and check, whatever its size: a fix, a feature, tests, docs, a dependency upgrade, a mechanical sweep. Raise the review level by risk; use adaptive when parts must be integrated."

[[stage]]
id = "implement"
kind = "work"
prompt = "implement.md"
timeout_minutes = 180
nudge = "The balanced tier at medium effort, high for a larger or subtle change; low only for docs, config or another trivial edit. The agent escalates a change that turns out risky."
