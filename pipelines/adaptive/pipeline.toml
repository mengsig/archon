[pipeline]
name = "adaptive"
description = "One lead sizes, builds, integrates and reviews the change before shipping"
version = 1
workspace = "worktree"
requires_repo = true

# The lead holds the review: an item's review level says how many reviewers.
[pipeline.review]
level = "standard"
stage = "build"

# Archon ships the commits this stage records; no agent does.
[pipeline.ship]
stage = "build"

# What the lead's workers run on unless the item's plan names `<stage>.workers`;
# Aether refuses a worker outside it. Reviewers follow the review contract.
[pipeline.workers]
tier = "balanced"
effort = "medium"
max_parallel = 2

[nudges]
tier = "balanced"
independent_reviewers = true
notes = "For a repository change where one lead that keeps its context through fixes, or integrates parts that split, saves restarts. A change one author can make and check belongs in direct, and unrelated changes are never bundled to fit here. The item's review level sets how many independent reviewers the lead owes: none, standard (one) or strict (three)."

[[stage]]
id = "build"
kind = "work"
prompt = "build.md"
allow_delegation = true
timeout_minutes = 180
nudge = "The strong tier at medium effort (the default); high for hard multi-file work. x_high only for a reasoning problem you can name that inspecting the code left unresolved: that the operator prefers strong models is not one. The lead chooses its reviewer at runtime within model policy. Its workers run on the balanced tier at medium, at most 2 at once ([pipeline.workers]), not on the lead's model: give `build.workers` only when the parts need another model or effort."
