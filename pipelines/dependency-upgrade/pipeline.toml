[pipeline]
name = "dependency-upgrade"
description = "Survey changelogs, upgrade libraries, toolchains or base images, verify build/tests/audit, then ship; use default-pr-review for features that add dependencies"
version = 1
workspace = "worktree"
requires_repo = true

# Archon ships the commits this stage records; no agent does.
[pipeline.ship]
stage = "upgrade"

[nudges]
tier = "balanced"
notes = "Version bumps of libraries, toolchains or base images, with breaking-change research and up to three verification fix loops. Not for adding a new dependency as part of a feature; use default-pr-review for that."

[[stage]]
id = "survey"
kind = "work"
prompt = "survey.md"
timeout_minutes = 90
nudge = "Prefer careful research at medium effort."

[[stage]]
id = "upgrade"
kind = "work"
prompt = "upgrade.md"
timeout_minutes = 120
nudge = "Prefer a strong coding model at high effort for breaking changes."

[[stage]]
id = "verify"
kind = "test"
prompt = "verify.md"
gate = "all_pass"
on_fail = { goto = "upgrade", max_loops = 3 }
timeout_minutes = 120
nudge = "Independently reproduce the checks at medium effort."
