[pipeline]
name = "design-doc"
description = "Design/RFC before a large or ambiguous change, with independent critique and an HTML report; use proposal: lavish for design and implementation in one item"
version = 1
workspace = "worktree"
requires_repo = true

[nudges]
tier = "strong"
independent_reviewers = true
notes = "Design/RFC before a large or ambiguous change. No product-code changes or shipping. Use the proposal: lavish knob instead when you want the design and the implementation in one item."

[[stage]]
id = "research"
kind = "work"
prompt = "research.md"
timeout_minutes = 120
effort = "high"
nudge = "Prefer the strong tier at high effort for repository research and architectural trade-offs."

[[stage]]
id = "critique"
kind = "review"
prompt = "critique.md"
gate = "all_pass"
timeout_minutes = 60
nudge = "Use an independent critic that discovers on its own; another provider at the same tier counts."
on_fail = { goto = "research", max_loops = 2 }

[[stage]]
id = "report"
kind = "report"
prompt = "report.md"
timeout_minutes = 45
