[pipeline]
name = "strict-pr-review"
description = "Implement, verify tests, three independent reviews that must all pass, then ship"
version = 1
workspace = "worktree"
requires_repo = true

# Archon ships the commits this stage records; no agent does.
[pipeline.ship]
stage = "implement"

[nudges]
tier = "strongest"
independent_reviewers = true
notes = "For security-sensitive, concurrency or architectural changes."

[[stage]]
id = "implement"
kind = "work"
prompt = "implement.md"
timeout_minutes = 180
nudge = "Strongest tier, high effort."

[[stage]]
id = "test"
kind = "test"
prompt = "test.md"
gate = "all_pass"
timeout_minutes = 60
nudge = "A capable model at high effort; it runs the full check suite and probes edge cases."
on_fail = { goto = "implement", max_loops = 3 }

[[stage]]
id = "review"
kind = "review"
prompt = "review.md"
fan_out = 3
gate = "all_pass"
timeout_minutes = 90
nudge = "Strongest tier; each reviewer independent of the implementer and of each other where possible."
on_fail = { goto = "implement", max_loops = 3 }
