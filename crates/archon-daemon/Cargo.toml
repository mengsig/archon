[package]
name = "archon-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false
description = "archond: socket server, dispatcher, pipeline executor, Aether event pump, orchestrator supervisor"

[dependencies]
archon-aether = { workspace = true }
archon-client = { workspace = true }
archon-core = { workspace = true }
archon-lavish = { workspace = true }
archon-pipeline = { workspace = true }
archon-queue = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
rustix = { workspace = true, features = ["event"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }
archon-queue = { workspace = true, features = ["testing"] }
archon-aether = { workspace = true, features = ["fake"] }
archon-core = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
